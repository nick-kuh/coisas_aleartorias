kind: AdaptiveDialog
modelDescription: |-
  Cobra o IT Manager responsável por um projeto do portfólio CDIO sobre uma falha de governança — atraso, campo obrigatório em branco, budget/benefit faltando, PGLS infinito, ou qualquer outro problema detectado. Lê o work item no Azure DevOps, faz uma auditoria de governança para listar os problemas encontrados, deixa o usuário escolher qual cobrar, monta o rascunho e só envia pelo Microsoft Teams depois da aprovação explícita. Use quando pedirem "cobrar o gestor", "avisar o responsável", "cobrar governança", "pedir informação", "cobrar budget", "cobrar benefit", "pedir a nova data", "mandar mensagem para o dono do projeto".

beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - cobrar o gestor
      - cobrar o responsável do projeto
      - avise o gestor
      - avisar o responsável
      - cobrar governança do projeto
      - cobrar budget do projeto
      - cobrar benefit do projeto
      - pedir informação ao gestor
      - pedir a nova data de go-live
      - mandar mensagem para o gestor do projeto
      - solicitar atualização ao gestor

  actions:
    # ------------------------------------------------------------------
    # 1. Qual work item
    # ------------------------------------------------------------------
    - kind: Question
      id: perguntarId
      variable: Topic.WorkItemId
      prompt: |-
        Qual o **Work Item ID** do projeto que você quer cobrar? (só o número, ex.: 376)
      entity: NumberPrebuiltEntity

    # ------------------------------------------------------------------
    # 2. Ler o estado atual no Azure DevOps (SILENT)
    # ------------------------------------------------------------------
    - kind: BeginDialog
      id: lerWorkItem
      input:
        id: =Value(Topic.WorkItemId)
      dialog: crdc4_AURAAgent.action.AzureDevOps-Obterosdetalhesdoitemdetrabalho
      output:
        binding:
          fields: Topic.DevOpsFields
          id: Topic.id
          rev: Topic.rev
          url: Topic.url

    - kind: SetVariable
      id: montarUrl
      variable: Topic.UrlWorkItem
      value: |-
        ="https://dev.azure.com/CDIO-IT-LATAM/CDIO%20Portfolio/_workitems/edit/" & Text(Topic.WorkItemId)

    # ------------------------------------------------------------------
    # 3. Auditoria de governança — lista os problemas encontrados
    # ------------------------------------------------------------------
    - kind: SearchAndSummarizeContent
      id: auditarGovernanca
      variable: Topic.GapsGovernanca
      userInput: |-
        ="Você é o AURA Agent auditando a governança de um projeto do CDIO LATAM.

        A partir dos dados abaixo, liste EM BULLETS os problemas de governança encontrados neste work item, considerando estas regras:

        OBRIGATÓRIOS SEMPRE: Title, State, Assigned To, Description, Project Type, Business Benefit, Business Product Domain, BG or BU Engagement, Project IT Manager, IT Area, Country Deployed, Portfolio Year, Implementation Time in Months.

        CONDICIONAIS:
        - Specify Cross → obrigatório se BG or BU Engagement = 'Cross'
        - Project Total Budget → a partir da fase '06 Plan Analyze'
        - Project Benefit Value → a partir da fase '05 Cost Approv'; opcional se Business Benefit não for 'Value Added'
        - Payback in Months, GoLive Date, PGLS End Date → a partir de '06 Plan Analyze'

        ATRASOS E ANOMALIAS:
        - GoLive Date vencida (anterior a hoje) e State < '10 Deployed' → atraso
        - Parado >60 dias em '02 Scoping' → risco alto
        - Parado >30 dias em '08 UAT' → risco alto
        - PGLS End Date estourada e State ainda '09 PGLS' → PGLS infinito
        - Watermelon: State parece verde mas Benefit vazio / zero

        NUNCA SINALIZAR: Security Assessment, Clarity ID, Note, Tags.
        NUNCA SINALIZAR se State for '10 Deployed' ou '11 Closed'.

        Retorne no MÁXIMO 5 problemas, um por bullet, no formato:
        - [Nome amigável do problema]: [o fato concreto extraído dos dados]

        Se não houver problemas, responda EXATAMENTE: SEM_PROBLEMAS.

        DADOS DO DEVOPS: [" & JSON(Topic.DevOpsFields) & "]"
      additionalSources:
        - value: =Topic.DevOpsFields
      mode: Restricted

    # ------------------------------------------------------------------
    # 4. Se não achou problema, ainda deixa o usuário cobrar algo específico
    # ------------------------------------------------------------------
    - kind: Question
      id: escolherFoco
      variable: Topic.FocoDaCobranca
      prompt: |-
        📋 **Auditoria de governança — Work Item {Topic.WorkItemId}**

        {Topic.GapsGovernanca}

        ---
        Descreva em uma linha o que você quer cobrar do gestor. Pode ser um dos problemas acima, uma combinação, ou outra coisa (ex.: "confirmação da fase atual", "novo scope").
      entity: StringPrebuiltEntity

    # ------------------------------------------------------------------
    # 5. Identificar o gestor a partir do dado real
    # ------------------------------------------------------------------
    - kind: SearchAndSummarizeContent
      id: identificarGestor
      variable: Topic.GestorSugerido
      userInput: |-
        ="A partir destes dados do Azure DevOps, retorne APENAS o endereço de e-mail do responsável pelo work item, sem nenhum outro texto.
        Procure nos campos 'Project IT Manager' e 'Assigned To'.
        Se não houver e-mail identificável, responda exatamente: NAO_ENCONTRADO.

        DADOS: [" & JSON(Topic.DevOpsFields) & "]"
      additionalSources:
        - value: =Topic.DevOpsFields
      mode: Restricted

    - kind: Question
      id: confirmarEmail
      variable: Topic.EmailGestor
      prompt: |-
        Vou te mostrar o rascunho para você aprovar. Depois de aprovado, a mensagem sai do **SEU chat 1:1** com o gestor no Teams (aparece como você mandando).

        Para quem devo enviar a cobrança do work item **{Topic.WorkItemId}**?

        Sugestão a partir do DevOps: **{Topic.GestorSugerido}**

        Confirme ou digite o e-mail correto.
      entity: StringPrebuiltEntity

    # ------------------------------------------------------------------
    # 6. Montar o rascunho focado no que o usuário escolheu cobrar
    # ------------------------------------------------------------------
    - kind: SearchAndSummarizeContent
      id: montarRascunho
      variable: Topic.Rascunho
      userInput: |-
        ="Você é o AURA Agent auxiliando o usuário " & System.User.FirstName & " a redigir uma mensagem de Microsoft Teams que ELE mesmo vai enviar ao IT Manager, do chat 1:1 dele com o gestor. Escreva EM PRIMEIRA PESSOA, como se fosse " & System.User.FirstName & " digitando.

        FOCO DA COBRANÇA (o que o usuário quer cobrar): " & Text(Topic.FocoDaCobranca) & "

        REGRAS:
        - Tom direto, factual e profissional. Cobre o dado, nunca a pessoa.
        - Máximo 6 linhas.
        - Comece com 'Oi, tudo bem?' (não invente o primeiro nome do gestor se não estiver nos dados).
        - Cite o nome do projeto e o Work Item " & Text(Topic.WorkItemId) & ".
        - Diga o fato concreto usando APENAS o que está nos dados abaixo. Se um dado não estiver, não o mencione.
        - NUNCA invente data, valor, prazo ou nome.
        - Peça EXPLICITAMENTE a informação que resolve o foco da cobrança:
          * Se for data: peça no formato DD/MM/AAAA.
          * Se for budget ou benefit: peça o valor em €.
          * Se for state/fase: peça a fase atual (uma das 13 oficiais).
          * Se for campo texto: peça o texto.
          Não invente unidade nem formato — pergunte o que o CDIO precisa receber.
        - Termine com o link: " & Topic.UrlWorkItem & "
        - Retorne SOMENTE o texto da mensagem, sem título, sem assinatura e sem comentários.

        DADOS DO DEVOPS: [" & JSON(Topic.DevOpsFields) & "]"
      additionalSources:
        - value: =Topic.DevOpsFields
      mode: Restricted

    # ------------------------------------------------------------------
    # 7. APROVAÇÃO OBRIGATÓRIA — nada é enviado antes daqui
    # ------------------------------------------------------------------
    - kind: Question
      id: aprovarEnvio
      variable: Topic.Aprovacao
      prompt: |-
        ✉️ **Rascunho da cobrança**

        **Para:** {Topic.EmailGestor}
        **Work Item:** {Topic.WorkItemId}
        **Foco:** {Topic.FocoDaCobranca}

        ---
        {Topic.Rascunho}
        ---

        Posso enviar?
      entity:
        kind: EmbeddedEntity
        definition:
          kind: ClosedListEntity
          items:
            - id: Enviar
              displayName: Enviar
            - id: Cancelar
              displayName: Cancelar

    - kind: ConditionGroup
      id: decidirEnvio
      conditions:
        - id: aprovado
          condition: =Text(Topic.Aprovacao) = "Enviar"
          actions:
            # ----------------------------------------------------------
            # 8. Enviar pelo Teams
            #    poster / location / bot já estão fixos na tool.
            # ----------------------------------------------------------
            - kind: BeginDialog
              id: enviarTeams
              input:
                body.recipient: =Topic.EmailGestor
                body.messageBody: =Topic.Rascunho
              dialog: crdc4_AURAAgent.action.MicrosoftTeams-Postarmensagememumchatoucanal
              output:
                binding:
                  messageLink: Topic.LinkMensagem
                  id: Topic.IdMensagem
                  conversationId: Topic.IdConversa

            - kind: SendActivity
              id: confirmarEnvio
              activity: |-
                ✅ Mensagem enviada do seu chat com **{Topic.EmailGestor}** no Teams sobre o work item **{Topic.WorkItemId}** (foco: {Topic.FocoDaCobranca}).

                Quando o gestor te responder no Teams, volte aqui e me diga **"atualizar informação do projeto"** — eu abro o fluxo de gravação no DevOps.

      elseActions:
        - kind: SendActivity
          id: envioCancelado
          activity: |-
            Ok, não enviei nada. Me diga o que quer ajustar no texto e eu refaço o rascunho.
