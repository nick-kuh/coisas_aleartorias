<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDIO LATAM 2027 Strategy · Executive view</title>
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF;
  --ink:#121A2E; --ink-2:#4A5166; --muted:#8C91A0; --faint:#C6C8D0;
  --line:#E5E4E1; --line-2:#EFEEEB;
  --accent:#2F4FA8;
  --c1:#2E7A68; --c2:#3B7896; --c3:#3E58A6; --c4:#6A5A93; --c5:#A88145; --c6:#A65A4C;
  --c7:#5F6F8C; --c8:#7E7A9E;
  --r:14px; --font:Inter,"Segoe UI",Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
.p1{--pc:var(--c1)} .p2{--pc:var(--c2)} .p3{--pc:var(--c3)} .p4{--pc:var(--c4)} .p5{--pc:var(--c5)} .p6{--pc:var(--c6)} .p7{--pc:var(--c7)} .p8{--pc:var(--c8)}
.l1{--la:var(--c1);--lb:var(--c2)} .l2{--la:var(--c3);--lb:var(--c4)} .l3{--la:var(--c5);--lb:var(--c6)} .l4{--la:var(--c7);--lb:var(--c8)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
#viewport{width:100%}
.stage{width:1600px;padding:22px 44px 22px;transform-origin:0 0;display:flex;flex-direction:column;gap:14px}
.rv{opacity:0;transform:translateY(10px);animation:rv .9s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes rv{to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
/* ===== HEADER ===== */
.hdr{display:flex;justify-content:space-between;align-items:flex-end}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1.5px;background:var(--ink)}
h1{font-size:32px;font-weight:300;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
h1 b{font-weight:700}
.tagline{font-size:15px;color:var(--ink-2);margin-top:6px}
.seg{position:relative;display:inline-flex;gap:2px;border-bottom:1px solid var(--line)}
.seg button{font-size:12.5px;font-weight:600;padding:6px 10px 8px;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"],.seg button:hover{color:var(--ink)}
.seg .ink-bar{position:absolute;bottom:-1px;height:2px;background:var(--ink);transition:left .35s var(--ease),width .35s var(--ease)}
/* ===== STRATEGY MAP · strategies laid out horizontally ===== */
.map{position:relative;display:grid;grid-template-columns:118px repeat(3,minmax(0,1fr));grid-template-rows:auto auto auto auto auto}
.benefit-total{display:inline-flex;align-items:baseline;gap:4px;margin-left:auto;padding:5px 9px;border-radius:999px;background:color-mix(in srgb,var(--la) 9%,#fff);border:1px solid color-mix(in srgb,var(--la) 22%,transparent);white-space:nowrap}
.benefit-total b{font-size:15px;letter-spacing:-.02em;color:var(--la)}
.benefit-total small{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* ===== AI @ SCALE · cross-strategy enabler (v11) ===== */
.ai-bridge{grid-column:2/-1;grid-row:4;position:relative;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;min-height:108px;padding:0;border-top:1px solid var(--line);border-left:1px solid var(--line-2);background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 4%,transparent),color-mix(in srgb,var(--c3) 4%,transparent) 50%,color-mix(in srgb,var(--c5) 4%,transparent))}
.ai-core{grid-column:1/-1;justify-self:stretch;margin:0 22px;height:50px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:12px;cursor:default;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 7%,#fff) 0%,#fff 32%,#fff 68%,color-mix(in srgb,var(--c5) 7%,#fff) 100%);border:1px solid var(--line);box-shadow:0 12px 26px -20px rgba(18,26,46,.45);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.ai-core::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2) 22%,var(--c3) 42%,var(--c4) 58%,var(--c5) 78%,var(--c6));transform:scaleX(0);transform-origin:center;animation:grow 1.1s var(--ease) forwards 1s}
.ai-core::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-18deg);animation:aisweep 6s var(--ease) infinite 2.2s;pointer-events:none}
@keyframes aisweep{0%{left:-30%}45%,100%{left:120%}}
.ai-core:hover,.ai-core:focus-visible{border-color:color-mix(in srgb,var(--c3) 30%,var(--line));box-shadow:0 20px 36px -20px rgba(18,26,46,.5),0 0 0 6px color-mix(in srgb,var(--c3) 7%,transparent)}
.ai-badge{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--c1),var(--c3),var(--c5),var(--c1));box-shadow:0 8px 18px -10px var(--c3);transition:transform .5s var(--ease)}
.ai-badge svg{width:16px;height:16px;stroke:#fff;fill:rgba(255,255,255,.25)}
.ai-core:hover .ai-badge,.ai-core:focus-visible .ai-badge{transform:rotate(90deg) scale(1.06)}
.ai-core h3{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1}
.ai-core h3 span{font-weight:300;color:var(--muted);margin:0 1px}
/* lane connectors: pillars (above) → AI @ Scale → wins (below), each in its strategy colour */
.ai-up,.ai-link{position:absolute;width:2px;margin-left:-1px;z-index:1}
.ai-up{top:0;height:calc(50% - 25px);background:linear-gradient(color-mix(in srgb,var(--la) 10%,transparent),var(--la))}
.ai-link{bottom:0;height:calc(50% - 27px);background:linear-gradient(var(--lb),color-mix(in srgb,var(--lb) 55%,transparent))}
.ai-link::after{content:"";position:absolute;bottom:2px;left:-3px;width:8px;height:8px;border-right:2px solid var(--lb);border-bottom:2px solid var(--lb);transform:rotate(45deg)}
.ai-up.a,.ai-link.a,.ai-port.a{left:16.66%}.ai-up.b,.ai-link.b,.ai-port.b{left:50%}.ai-up.c,.ai-link.c,.ai-port.c{left:83.33%}
.ai-port{position:absolute;z-index:3;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;border:2px solid var(--la);transition:background .35s,transform .35s var(--ease)}
.ai-port.t{top:calc(50% - 30px)}.ai-port.bt{top:calc(50% + 18px);border-color:var(--lb)}
.map.ai-on .ai-port{background:var(--la);transform:scale(1.15)}.map.ai-on .ai-port.bt{background:var(--lb)}
.ai-dot{position:absolute;left:-2px;width:6px;height:6px;border-radius:50%;background:var(--la);opacity:0;animation:aiflow 3.2s linear infinite;animation-delay:var(--fd,0s)}
.ai-link .ai-dot{background:var(--lb)}
@keyframes aiflow{0%{top:0;opacity:0}15%{opacity:.9}85%{opacity:.9}100%{top:100%;opacity:0}}
.rowhead .ai-lbl{display:flex;align-items:flex-start;gap:6px;letter-spacing:.14em;color:var(--ink-2)}
.rowhead .ai-lbl svg{width:12px;height:12px;stroke:var(--ink-2);margin-top:2px;flex:none}
.ben{display:inline-flex;align-items:center;justify-content:flex-end;min-width:86px;font-size:11px;font-weight:700;color:var(--pc);white-space:nowrap}.ben.none{color:var(--faint);font-weight:600}
.d-row .chips{margin-left:auto}.d-row{align-items:center}
.rowhead{grid-column:1;padding:14px 14px 0 0;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.6;border-top:1px solid var(--line)}
.rowhead .win-cta{display:flex;align-items:flex-start;line-height:1.6;letter-spacing:.14em}
.rowhead .win-cta svg{margin-top:2px;flex:none}
.lane-l{position:relative;padding:11px 18px 10px 20px;display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);border-left:1px solid var(--line-2)}
.lane-l::before{content:"";position:absolute;left:0;top:-1px;height:3px;width:100%;background:linear-gradient(90deg,var(--la),var(--lb));transform:scaleX(0);transform-origin:left;animation:grow 1s var(--ease) forwards;animation-delay:var(--d,0s)}
.lane-l .badge{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--la),var(--lb));box-shadow:0 10px 22px -12px var(--la)}
.lane-l .badge svg{width:20px;height:20px;stroke:#fff}
.lane-l h3{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.lane-l small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.lane-l .lc{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap}
.lane-l .lc b{font-size:15px;letter-spacing:-.01em;color:var(--la);margin-right:4px}
/* AI lane: attenuated tint, same structure */
.ai-col{background:linear-gradient(180deg,color-mix(in srgb,var(--c7) 4%,transparent),color-mix(in srgb,var(--c8) 3%,transparent))}
.lane-c{display:flex;flex-direction:column;border-top:1px solid var(--line);border-left:1px solid var(--line-2)}
.lane-c.lv2{border-top-color:var(--line-2)}
.lane-c>.pillar{flex:1}
.pillar{position:relative;width:100%;padding:11px 18px 11px 22px;display:flex;flex-direction:column;transition:opacity .3s,background .35s;border-top:1px solid var(--line-2)}
.pillar:first-child{border-top:0}
.pillar.off{display:none}
.pillar:hover,.pillar.hl,.pillar:focus-visible{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 7%,transparent),transparent 85%)}
.pillar::before{content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--pc);transform:scaleY(.35);transform-origin:top;transition:transform .45s var(--ease)}
.pillar:hover::before,.pillar.hl::before,.pillar:focus-visible::before{transform:scaleY(1)}
.p-ic{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 10%,#fff);border:1px solid color-mix(in srgb,var(--pc) 25%,transparent);transition:background .35s,transform .35s var(--ease)}
.p-ic svg{width:19px;height:19px;stroke:var(--pc);transition:stroke .35s}
.pillar:hover .p-ic,.pillar.hl .p-ic,.pillar:focus-visible .p-ic{background:var(--pc);transform:scale(1.05)}
.pillar:hover .p-ic svg,.pillar.hl .p-ic svg,.pillar:focus-visible .p-ic svg{stroke:#fff}
.p-top{display:flex;align-items:center;gap:12px;margin-bottom:5px}
.p-top h4{font-size:16.5px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.p-top .go{margin-left:auto;flex:none;width:15px;height:15px;stroke:var(--faint);transition:transform .3s var(--ease),stroke .3s}
.pillar:hover .go,.pillar:focus-visible .go{transform:translateX(4px);stroke:var(--pc)}
.pwin{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--pc);margin-bottom:7px}
.pwin svg{width:14px;height:14px;stroke:var(--pc);flex:none}
.prios{list-style:none;display:flex;flex-direction:column;gap:3px}
.prio{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.35;color:var(--ink-2);animation:rv .45s var(--ease) both}
.prio::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc);opacity:.45;flex:none;margin-top:5px}
.prio .nm{flex:1;min-width:0}
.prio .chips{flex:none;margin-top:1px}
.prio.off{display:none}
.map.ai-on .pillar .prio{color:var(--ink)}
.map.ai-on .pillar .prio::before{opacity:1}
.map.ai-on .pillar h4{color:var(--pc)}
.foot{display:flex;gap:5px;margin-top:auto;padding-top:8px;align-items:center}
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:20px;padding:0 7px;border-radius:10px;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--faint);border:1px dashed var(--line)}
.mk.on{color:#fff;background:var(--pc);border:1px solid var(--pc)}
.cnt{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap}
.cnt b{font-size:15px;letter-spacing:-.01em;color:var(--pc);margin-right:4px}
.chips{display:flex;gap:4px;align-items:center}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);line-height:1;padding:3px 0;min-width:18px;text-align:center}
.chip.latam{color:var(--ink)}
.chips .chip+.chip{padding-left:4px;border-left:1px solid var(--line)}
.empty{display:none;padding:26px 22px;font-size:12.5px;line-height:1.5;color:var(--muted);font-style:italic}
.lane-c.none .empty{display:block;animation:rv .45s var(--ease) both}
/* outcomes */
.out{position:relative;padding:12px 18px 12px 22px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);border-left:1px solid var(--line-2);background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--la) 6%,transparent))}
.w{display:grid;grid-template-columns:36px 1fr;column-gap:12px;align-items:center;cursor:default;outline-offset:6px;transition:opacity .3s}
.w.dim{opacity:.3}
.w .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--pc);background:color-mix(in srgb,var(--pc) 8%,#fff);transition:background .3s,transform .3s var(--ease)}
.w .ic svg{width:19px;height:19px;stroke:var(--pc);transition:stroke .3s}
.w:hover .ic,.w:focus-visible .ic{background:var(--pc);transform:scale(1.06)}
.w:hover .ic svg,.w:focus-visible .ic svg{stroke:#fff}
.w b{font-size:14.5px;font-weight:600;line-height:1.3;display:block;letter-spacing:-.01em}
.links{display:flex;gap:4px;margin-top:5px}
.links i{width:20px;height:4px;border-radius:2px;background:var(--pc)}
.win-cta{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.win-cta svg{width:12px;height:12px;stroke:var(--accent)}
/* ===== ADDITIONAL RESOURCES (collapsed by default) ===== */
.res{border-top:1px solid var(--line);padding-top:18px}
.res-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;border-radius:10px}
.res-h h3{font-size:19px;font-weight:600;letter-spacing:-.02em}
.res-h .rt{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);transition:color .25s}
.res-h .rt i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:transform .45s var(--ease),background .25s,border-color .25s}
.res-h .rt svg{width:14px;height:14px;stroke:var(--ink)}
.res-h:hover .rt{color:var(--ink)}
.res-h:hover .rt i{background:var(--card);border-color:var(--faint)}
.res.open .res-h .rt i{transform:rotate(180deg)}
.res-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.res.open .res-body{grid-template-rows:1fr}
.res-in{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s linear .5s}
.res.open .res-in{visibility:visible;transition:none}
.res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding:16px 0 4px}
.res-sub{font-size:12px;color:var(--muted);margin-top:-2px}
.thumb{display:flex;flex-direction:column;border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.thumb:hover,.thumb:focus-visible{transform:translateY(-3px);box-shadow:0 18px 32px -20px rgba(18,26,46,.35)}
.thumb .im{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--line-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.thumb:hover img{transform:scale(1.03)}
.thumb .zoom{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(18,26,46,.72);opacity:0;transition:opacity .3s}
.thumb .zoom svg{width:15px;height:15px;stroke:#fff}
.thumb:hover .zoom,.thumb:focus-visible .zoom{opacity:1}
.thumb .meta{display:flex;align-items:center;gap:12px;padding:12px 16px}
.thumb .meta i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.thumb .meta b{font-size:13.5px;font-weight:600}
.thumb .meta small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
/* ===== DRAWER ===== */
.scrim{position:fixed;inset:0;background:rgba(18,26,46,.16);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(540px,100%);background:#fff;z-index:21;
  transform:translateX(102%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s linear .45s;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .45s var(--ease);box-shadow:-20px 0 50px rgba(18,26,46,.08)}
.d-head{position:relative;padding:36px 34px 22px;border-bottom:1px solid var(--line)}
.d-head .eyebrow::before{background:var(--pc)}
.d-head .big{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--pc);margin-top:18px}
.d-head .big svg{width:24px;height:24px;stroke:#fff}
.d-head h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:6px 0 8px}
.d-head .win{font-size:14px;font-style:italic;color:var(--pc);font-weight:500}
.d-close{position:absolute;top:22px;right:22px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .3s var(--ease);z-index:2}
.d-close:hover{background:var(--line-2);transform:rotate(90deg)}
.d-close svg{width:16px;height:16px;stroke:var(--ink)}
.d-body{padding:6px 34px 34px;overflow:auto}
.d-body h3{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pc);margin:24px 0 4px;font-weight:700}
.d-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;opacity:0;animation:rv .5s var(--ease) forwards;animation-delay:var(--d,0s)}
.d-row .nt{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.d-row .hz{font-size:11px;color:var(--ink-2);white-space:nowrap;margin-left:8px;min-width:74px;text-align:right}
.d-row .hz.none{color:var(--faint)}
.d-row.off{display:none!important}
.d-foot{font-size:11px;color:var(--muted);margin-top:20px;line-height:1.5}
/* ===== LIGHTBOX ===== */
.lb{position:fixed;inset:0;z-index:40;background:rgba(12,17,30,.88);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.lb.open{opacity:1;pointer-events:auto}
.lb figure{position:relative;max-width:min(92vw,1500px);display:flex;flex-direction:column;align-items:center;gap:14px;transform:scale(.97);transition:transform .4s var(--ease)}
.lb.open figure{transform:none}
.lb img{max-width:100%;max-height:82vh;border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);background:#fff}
.lb figcaption{color:rgba(255,255,255,.85);font-size:13px;letter-spacing:.02em}
.lb figcaption b{color:#fff;font-weight:600;margin-right:10px}
.lb .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);transition:background .2s}
.lb .nav:hover{background:rgba(255,255,255,.18)}
.lb .nav svg,.lb .x svg{width:18px;height:18px;stroke:#fff}
.lb .prev{left:22px}.lb .next{right:22px}
.lb .x{position:fixed;top:20px;right:22px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
/* ===== RESPONSIVE ===== */
body.flow .stage{width:100%;transform:none!important;margin-left:0!important;padding:24px}
@media (max-width:1100px){
  body.flow .hdr{flex-direction:column;align-items:flex-start;gap:14px}
  body.flow .map{display:flex;flex-direction:column}

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const pil=id=>PILLARS.find(p=>p.id===id);
const its=p=>ITEMS.filter(i=>i.p===p);
const chip=m=>`<span class="chip${m==="LATAM"?" latam":""}" title="${MK[m]}">${m}</span>`;
const chipsOf=i=>ORDER.filter(x=>i.m.includes(x)).map(chip).join("");
const svg=(d,c="",w=1.5)=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const arrow='<path d="M5 12h14M13 6l6 6-6 6"/>';
const reach=p=>{const s=new Set();its(p.id).forEach(i=>i.m.forEach(x=>s.add(x)));return s;};
const sumBenefit=list=>list.reduce((a,i)=>a+(typeof i.benefit==="number"?i.benefit:0),0);
const fmtBenefit=v=>`€${Number(v.toFixed(3)).toLocaleString("en-US",{maximumFractionDigits:3})}M`;
const laneBenefit=id=>sumBenefit(ITEMS.filter(i=>pil(i.p).theme===id));
/* ===== STRATEGY MAP ===== */
function winHTML(w){
  return `<div class="w ${pil(w.l[0]).cls}" tabindex="0" data-l="${w.l.join(" ")}" title="Driven by: ${esc(w.l.map(id=>pil(id).name).join(", "))}"><span class="ic">${svg(w.i,"",1.7)}</span><span><b>${esc(w.t)}</b><span class="links">${w.l.map(id=>`<i class="${pil(id).cls}"></i>`).join("")}</span></span></div>`;
}
function pillarHTML(p,d){
  const r=reach(p),list=its(p.id);
  return `<button type="button" class="pillar ${p.cls} rv" style="--d:${d}s" id="${p.id}" data-open="${p.id}" title="${esc(p.win)}" aria-label="${esc(p.name)}: ${esc(p.win)}. ${list.length} initiatives. Open details">
    <span class="p-top"><span class="p-ic">${svg(p.icon,"",1.6)}</span><h4>${esc(p.name)}</h4>${svg(arrow,"go",1.6)}</span>
    <span class="pwin">${svg('<path d="M5 12l5 5L20 7"/>',"",2.2)}${esc(p.win)}</span>
    <ul class="prios">${list.map(i=>`<li class="prio" data-m="${i.m.join(" ")}" title="${esc(i.src)} · ${esc(i.m.map(m=>MK[m]).join(", "))}"><span class="nm">${esc(i.src)}</span><span class="chips">${chipsOf(i)}</span></li>`).join("")}</ul>
    <span class="foot" aria-label="Market footprint">${ORDER.map(m=>`<span class="mk${r.has(m)?" on":""}" title="${MK[m]}">${m}</span>`).join("")}<span class="cnt"><b>${list.length}</b><span class="u">${list.length===1?"initiative":"initiatives"}</span></span></span>
  </button>`;
}
function renderMap(){
  let h=`<div class="rowhead rv" style="grid-row:1;--d:.3s">Strategy</div>
    <div class="rowhead rv" style="grid-row:2/4;--d:.3s">Pillars &amp; initiatives</div>
    <div class="rowhead rv" style="grid-row:4;--d:.3s;align-self:stretch;display:flex;align-items:center;padding-top:0"><span class="ai-lbl">${svg(SPARK,"",1.8)}AI across<br>all strategies</span></div>
    <div class="rowhead rv" style="grid-row:5;--d:.3s"><span class="win-cta">${svg('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',"",1.8)}2027 · What winning looks like</span></div>`;
  THEMES.forEach((t,ti)=>{
    const col=ti+2, ps=PILLARS.filter(p=>p.theme===t.id), d=.4+ti*.12, n=ps.reduce((a,p)=>a+its(p.id).length,0), ben=laneBenefit(t.id);
    h+=`<div class="lane-l ${t.cls} rv" style="grid-row:1;grid-column:${col};--d:${d}s;--o:${ti*4}"><span class="badge">${svg(t.icon,"",1.8)}</span><span><h3>${t.name}</h3></span><span class="benefit-total" title="Total quantified benefit for ${esc(t.name)}"><b>${fmtBenefit(ben)}</b><small>benefit</small></span><span class="lc" data-lane="${t.id}"><b>${n}</b><span class="u">${n===1?"initiative":"initiatives"}</span></span></div>`;
    [0,1].forEach(lv=>{const p=ps[lv];
      h+=`<div class="lane-c${lv?" lv2":""}" data-lane="${t.id}" data-lv="${lv+1}" data-name="${t.name}" style="grid-row:${lv+2};grid-column:${col};--o:${ti*4+lv+1}">${p?pillarHTML(p,d+.08+lv*.08):""}${lv?"":`<p class="empty"></p>`}</div>`;});
    h+=`<div class="out ${t.cls} rv" style="grid-row:5;grid-column:${col};--d:${d+.3}s;--o:${ti*4+3}">${WINS.filter(w=>w.lane===t.id).map(winHTML).join("")}</div>`;
  });
  const conn=(cls,k,i)=>`<span class="ai-up ${k} ${cls}"><i class="ai-dot" style="--fd:${i*.4}s"></i></span><span class="ai-port t ${k} ${cls}"></span><span class="ai-port bt ${k} ${cls}"></span><span class="ai-link ${k} ${cls}"><i class="ai-dot" style="--fd:${1.6+i*.4}s"></i></span>`;
  h+=`<div class="ai-bridge rv" style="--d:.85s">${THEMES.map((t,i)=>conn(t.cls,"abc"[i],i)).join("")}<div class="ai-core" id="ai-core" tabindex="0" title="AI @ Scale: cross-strategy enabler for ${THEMES.map(t=>t.name).join(", ")}" aria-label="AI @ Scale, cross-strategy enabler for all ${THEMES.length} strategies"><span class="ai-badge">${svg(SPARK,"",1.6)}</span><h3>AI <span>@</span> Scale</h3></div></div>`;
  h+=`<div style="grid-column:1/-1;grid-row:6;border-top:1px solid var(--line)"></div>`;
  $("#map").innerHTML=h;
}
function renderTagline(){
  $("#tagline").innerHTML=`${THEMES.length} strategies, ${PILLARS.length} pillars, ${ITEMS.length} initiatives, one regional team powered by AI @ Scale: <b style="font-weight:600;color:var(--ink)">grow demand, simplify the core, unlock productivity, scale AI.</b>`;
}
/* ===== RESOURCES ===== */
let cur=0;
function renderRes(){
  $("#res-grid").innerHTML=SLIDES.map((s,i)=>`<button type="button" class="thumb" data-slide="${i}" aria-label="Open slide ${i+1}: ${s.t}">
    <span class="im"><img src="${s.src}" alt="Slide ${i+1}: ${s.t}" loading="lazy"><span class="zoom">${svg('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"/>',"",1.8)}</span></span>
    <span class="meta"><i>${String(i+1).padStart(2,"0")}</i><span><b>${s.t}</b><small>${s.s}</small></span></span></button>`).join("");
}
function toggleRes(force){
  const r=$("#res"),o=typeof force==="boolean"?force:!r.classList.contains("open");
  r.classList.toggle("open",o);$("#res-toggle").setAttribute("aria-expanded",o);$("#res-toggle .rt-l").textContent=o?"Hide slides":"Show slides";
  fit();setTimeout(()=>{fit();if(o)r.scrollIntoView({behavior:"smooth",block:"start"});},520);
}
function showSlide(i){cur=(i+SLIDES.length)%SLIDES.length;const s=SLIDES[cur];$("#lb-img").src=s.src;$("#lb-img").alt=s.t;$("#lb-cap").innerHTML=`<b>${s.t}</b>${cur+1} / ${SLIDES.length}`;}
function openLb(i){showSlide(i);lastFocus=document.activeElement;$("#lb").classList.add("open");$("#lb").setAttribute("aria-hidden","false");$("#lb-x").focus();}
function closeLb(){$("#lb").classList.remove("open");$("#lb").setAttribute("aria-hidden","true");if(lastFocus)lastFocus.focus();}
/* ===== INTERACTIONS ===== */
let market="ALL";
/* LATAM-tagged initiatives cover Brazil, Mexico and Argentina */
const ok=m=>market==="ALL"||m.includes(market)||(market!=="LATAM"&&m.includes("LATAM"));
function renderFilter(){
  $("#mkt").innerHTML=[["ALL","All"],...ORDER.map(m=>[m,m])].map(([v,l])=>`<button type="button" data-mkt="${v}" aria-pressed="${v===market}" title="${v==="ALL"?"All markets":MK[v]}">${l}</button>`).join("")+`<span class="ink-bar" aria-hidden="true"></span>`;
}
function moveInk(){const b=$(`#mkt button[data-mkt="${market}"]`),bar=$("#mkt .ink-bar");if(!b)return;bar.style.left=b.offsetLeft+8+"px";bar.style.width=b.offsetWidth-16+"px";}
function applyFilter(){
  /* hide initiatives (and empty pillars) that do not apply to the selected market */
  document.querySelectorAll(".pillar").forEach(p=>{let n=0;p.querySelectorAll(".prio").forEach(li=>{const g=ok(li.dataset.m.split(" "));li.classList.toggle("off",!g);if(g)n++;});p.classList.toggle("off",!n);p.querySelector(".cnt b").textContent=n;p.querySelector(".cnt .u").textContent=n===1?"initiative":"initiatives";});
  document.querySelectorAll('.lane-c[data-lv="1"]').forEach(c=>{const n=document.querySelectorAll(`.lane-c[data-lane="${c.dataset.lane}"] .prio:not(.off)`).length;c.classList.toggle("none",!n);
    c.querySelector(".empty").textContent=market==="LATAM"?`No regional ${c.dataset.name} initiatives in source.`:`No ${c.dataset.name} initiatives mapped for ${MK[market]}.`;
    const lc=$(`.lc[data-lane="${c.dataset.lane}"] b`);if(lc){lc.textContent=n;lc.nextElementSibling.textContent=n===1?"initiative":"initiatives";}});
  document.querySelectorAll(".w").forEach(w=>w.classList.toggle("dim",w.dataset.l.split(" ").every(id=>$("#"+id).classList.contains("off"))));
  document.querySelectorAll("#mkt button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mkt===market));
  document.querySelectorAll(".d-row").forEach(r=>r.classList.toggle("off",!ok(r.dataset.m.split(" "))));
  fit();
}
function hl(ids){document.querySelectorAll(".pillar").forEach(p=>p.classList.toggle("hl",ids.includes(p.id)));}
let lastFocus=null;
function openDrawer(id){
  const p=pil(id),t=THEMES.find(x=>x.id===p.theme),dr=$("#drawer");
  dr.className="drawer "+p.cls;
  $("#d-head").innerHTML=`<div class="eyebrow">${t.name} · ${fmtBenefit(sumBenefit(its(id)))} quantified benefit</div><div class="big">${svg(p.icon,"",1.6)}</div><h2 id="d-title">${esc(p.name)}</h2><span class="win">${esc(p.win)}</span>`;
  $("#d-body").innerHTML=`<h3>Initiatives</h3>`+its(id).map((i,n)=>`<div class="d-row" style="--d:${.15+n*.04}s" data-m="${i.m.join(" ")}"><span>${esc(i.src)}${i.nt?`<span class="nt">${i.nt}</span>`:""}</span><span class="ben${typeof i.benefit==="number"?"":" none"}" title="Benefit Value (€M) from Strategic Initiatives 2027">${typeof i.benefit==="number"?fmtBenefit(i.benefit):"Not quantified"}</span><span class="chips">${chipsOf(i)}<span class="hz${i.hz?"":" none"}" title="${i.hz?"Horizon in Mapping 2027":"Not mapped to a horizon in Mapping 2027"}">${i.hz||"—"}</span></span></div>`).join("")+`<p class="d-foot">Initiative names from the Strategic Initiatives 2027 sheet, consolidated where applicable. LATAM = covers Brazil, Mexico and Argentina. Horizon (Ramp-Up · Recalibrate · Transform) as per the Mapping 2027 sheet; “—” = not yet mapped. Benefit values are shown in €M exactly as quantified in column D; “Not quantified” means the source cell is blank. The market filter also applies here.</p>`;
  requestAnimationFrame(()=>dr.classList.add("open"));dr.setAttribute("aria-hidden","false");$("#scrim").classList.add("open");
  lastFocus=document.activeElement;$("#d-close").focus();applyFilter();
}
function closeDrawer(){$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");$("#scrim").classList.remove("open");if(lastFocus)lastFocus.focus();}
/* ===== FIT ===== */
function fit(){
  const vw=innerWidth,vh=innerHeight,flow=vw<1100||vh>vw;
  document.body.classList.toggle("flow",flow);
  const st=$("#stage"),vp=$("#viewport");
  if(flow){st.style.transform="";st.style.marginLeft="";vp.style.height="";moveInk();return;}
  st.style.transform="";
  const h=st.scrollHeight,map=$("#map"),core=map.offsetTop+map.offsetHeight+22;
  const s=Math.min(vw/1600,vh/core),ml=Math.max(0,(vw-1600*s)/2);
  st.style.transform=`scale(${s})`;st.style.marginLeft=ml+"px";vp.style.height=h*s+"px";moveInk();
}
function init(){
  renderTagline();renderMap();renderFilter();renderRes();applyFilter();
  $("#mkt").addEventListener("click",e=>{const b=e.target.closest("button");if(b){market=b.dataset.mkt;applyFilter();}});
  document.addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b)openDrawer(b.dataset.open);const s=e.target.closest("[data-slide]");if(s)openLb(+s.dataset.slide);});
  document.addEventListener("keydown",e=>{
    if($("#lb").classList.contains("open")){
      if(e.key==="Escape")closeLb();if(e.key==="ArrowRight")showSlide(cur+1);if(e.key==="ArrowLeft")showSlide(cur-1);return;}
    if(e.key==="Escape"&&$("#drawer").classList.contains("open"))closeDrawer();
    if(e.key==="Tab"&&$("#drawer").classList.contains("open")){e.preventDefault();$("#d-close").focus();}
  });
  $("#res-toggle").addEventListener("click",()=>toggleRes());
  $("#d-close").addEventListener("click",closeDrawer);$("#scrim").addEventListener("click",closeDrawer);
  $("#lb-x").addEventListener("click",closeLb);$("#lb-prev").addEventListener("click",()=>showSlide(cur-1));$("#lb-next").addEventListener("click",()=>showSlide(cur+1));
  $("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb();});
  document.querySelectorAll(".w").forEach(w=>{const on=()=>hl(w.dataset.l.split(" ")),off=()=>hl([]);
    w.addEventListener("mouseenter",on);w.addEventListener("mouseleave",off);w.addEventListener("focus",on);w.addEventListener("blur",off);});
  {const ai=$("#ai-core"),on=()=>{$("#map").classList.add("ai-on");hl(PILLARS.map(p=>p.id));},off=()=>{$("#map").classList.remove("ai-on");hl([]);};
    ai.addEventListener("mouseenter",on);ai.addEventListener("mouseleave",off);ai.addEventListener("focus",on);ai.addEventListener("blur",off);}
  addEventListener("resize",fit);
  addEventListener("beforeprint",()=>{$("#stage").style.transform="";});addEventListener("afterprint",fit);
  fit();
}
init();
</script>
</body>
</html>
